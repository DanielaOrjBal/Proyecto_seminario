{% block page_styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/layout.css') }}">
{% endblock %}

<nav class="navbar navbar-expand-lg custom-navbar">
  <div class="container-fluid">
    <a class="navbar-brand" href="{{ url_for('home') }}">
      <img src="{{ url_for('static', filename='img/logo_vitaria.png') }}" alt="Logo" class="navbar-logo" />
      <span class="navbar-title">VITARIA. SOS</span>
    </a>

    <!-- Toggle responsive -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
      aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Links -->
    <div class="collapse navbar-collapse" id="navbarNav">

      <!-- Botones -->
      <div class="d-flex gap-2 ms-auto">
        <a href="{{ url_for('home') }}" class="btn btn-secondary" lan-target="Ingresar">
          <i class="bi bi-person-circle"></i> Ir al inicio
        </a>
        <a href="#" class="btn btn-primary" 
        data-bs-toggle="modal" data-bs-target="#modalPoliticas" lan-target="Registrarse">
          <i class="bi bi-person-fill"></i> Registrarse
        </a>
    </div>
  </div>
</nav>


<script>
document.getElementById('mobileMenuToggler').addEventListener('click', function() {
  const mobileMenu = document.getElementById('mobileMenu');
  mobileMenu.classList.toggle('show');
});

// Cerrar menú al hacer click fuera
document.addEventListener('click', function(event) {
  const mobileMenu = document.getElementById('mobileMenu');
  const toggler = document.getElementById('mobileMenuToggler');
  
  if (!mobileMenu.contains(event.target) && !toggler.contains(event.target)) {
    mobileMenu.classList.remove('show');
  }
});
</script>
