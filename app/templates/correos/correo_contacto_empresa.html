<!DOCTYPE html>
<html>

<body style="margin:0; padding:0; background-color:#f4f6f9; font-family: Arial, sans-serif;">

    <!-- Contenedor principal -->
    <table width="100%" cellpadding="0" cellspacing="0">
        <tr>
            <td align="center">

                <!-- Caja del correo -->
                <table width="600" cellpadding="0" cellspacing="0"
                    style="background-color:#ffffff; border-radius:10px; overflow:hidden;">

                    <!-- Encabezado -->
                    <tr>
                        <td align="center" bgcolor="#1b5aad" style="padding: 25px 0;">
                            <img src="cid:logo_vitaria" alt="Logo VITARIA SOS" width="90"
                                style="display: block; margin-bottom: 10px;">
                            <h1 style="color: #ffffff; font-size: 24px; margin: 0;">Nuevo ticket creado</h1>
                        </td>
                    </tr>

                    <!-- Cuerpo -->
                    <tr>
                        <td style="padding:25px; color:#333333; font-size:15px;">

                            <p>Se ha recibido un nuevo mensaje desde el formulario de contacto.</p>

                            <div style="background-color:#f0f8ff; padding:15px; border-radius:8px; margin-top:15px;">

                                <p><strong>👤 Nombre:</strong> {{ nombre }}</p>
                                <p><strong>📧 Correo:</strong> {{ email }}</p>

                                <p><strong>📝 Mensaje:</strong></p>
                                <p style="white-space:pre-line;">{{ mensaje }}</p>

                            </div>

                            <p style="margin-top:20px;">
                                Por favor, realizar el seguimiento correspondiente.
                            </p>

                        </td>
                    </tr>

                    <!-- Pie -->
                    <tr>
                        <td align="center" style="background-color:#f8f9fa; padding:20px; font-size:12px; color:#777;">
                            © 2026 VITARIA SOS · Sistema Oficial<br>
                            Este es un mensaje automático del sistema.
                        </td>
                    </tr>

                </table>

            </td>
        </tr>
    </table>

</body>

</html>
