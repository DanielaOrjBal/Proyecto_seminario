{% block page_styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
{% endblock %}

<nav class="navbar navbar-expand-lg custom-navbar">
  <div class="container-fluid">
    <a class="navbar-brand">
      <img src="{{ url_for('static', filename='img/logo_vitaria.png') }}" alt="Logo" class="navbar-logo" />
    </a>

    <!-- Toggle responsive -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
      aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Links -->
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link" aria-current="page" href="#" data-section="dashboard">Panel principal</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#" data-section="register">Registrar caso</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#" data-section="consult">Consultar casos</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#" data-section="account">Mi cuenta</a>
        </li>
      </ul>
      <!-- Botones -->
      <div class="d-flex gap-2 ms-auto">
        <a data-bs-toggle="modal" data-bs-target="#logoutModal" class="btn btn-primary" lan-target="BtnCerrarSesion">
          Cerrar Sesión
        </a>
      </div>
    </div>
</nav>


<!-- Modal de cierre de sesión -->
<div class="modal fade" id="logoutModal" tabindex="-1" aria-labelledby="logoutModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header text-white">
        <h5 class="modal-title" id="logoutModalLabel" lan-target="TituloCerrarSesion">Cierre de sesión</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body" lan-target="TextoCerrarSesion">
        Está cerrando sessión. ¿Desea continuar?
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"
          lan-target="BtnCancelar">Cancelar</button>
        <a href="{{ url_for('auth.logout') }}" class="btn btn-primary" lan-target="BtnCerrarSesionConfirmar">Cerrar
          sesión</a>
      </div>
    </div>
  </div>
</div>
